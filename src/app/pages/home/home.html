<div class="bg-success text-white text-center py-2 mb-4">
  <h2>Tarefas - {{ dataAtual }}</h2>
</div>

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold">Minhas tarefas</h2>
    <p class="text-muted mb-0">Organize suas atividades.</p>
  </div>

  <a routerLink="/tarefa-nova" class="btn btn-primary">
    <i class="bi bi-plus-lg"></i>
    Adicionar
  </a>
</div>

<div class="row g-3">
  <div class="col-12 col-md-6 col-lg-4" *ngFor="let tarefa of tarefas">
    <app-tarefa-card [tarefa]="tarefa" (deletar)="deletar($event)" (editar)="editar($event)"></app-tarefa-card>
  </div>
</div>
